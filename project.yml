name: RPMBuddy
options:
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7JT2JB89AV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  RPMBuddy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    postBuildScripts:
      - name: Copy Metronome Fixtures
        basedOnDependencyAnalysis: false
        script: |
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Fixtures"
          mkdir -p "${dest}"
          cp "${SRCROOT}/Resources/Fixtures/"*.wav "${dest}/" 2>/dev/null || true
          if [ -f "${SRCROOT}/Resources/Fixtures/manifest.json" ]; then
            cp "${SRCROOT}/Resources/Fixtures/manifest.json" "${dest}/"
          fi
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: RPM Buddy
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.rpmbuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "RPM Buddy listens through the microphone to estimate the tempo of nearby music."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  RPMBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: RPMBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.rpmbuddy.tests
        GENERATE_INFOPLIST_FILE: YES

  RPMBuddyUISmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RPMBuddyUITests
    dependencies:
      - target: RPMBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.rpmbuddy.uitests.smoke
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RPMBuddy

schemes:
  RPMBuddy:
    build:
      targets:
        RPMBuddy: all
    test:
      targets:
        - RPMBuddyTests
        - name: RPMBuddyUISmokeUITests
          parallelizable: true
      gatherCoverageData: true

  RPMBuddyCI:
    build:
      targets:
        RPMBuddy: all
    test:
      targets:
        - RPMBuddyTests
      gatherCoverageData: true

  RPMBuddyUISmoke:
    build:
      targets:
        RPMBuddy: all
    test:
      targets:
        - name: RPMBuddyUISmokeUITests
          parallelizable: true
